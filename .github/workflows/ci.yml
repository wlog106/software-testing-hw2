name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest
        run: python -m unittest -v CalcTest

  quality:
    name: Static analysis + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Static analysis (ruff)
        run: ruff check --output-format=github .
      - name: Tests under coverage
        run: coverage run --branch --source=Calc -m unittest -v CalcTest
      - name: Coverage report (fail below 100%)
        run: |
          coverage report -m --fail-under=100
          coverage report -m --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: HTML coverage report
        if: always()
        run: coverage html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
